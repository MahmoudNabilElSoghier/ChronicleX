name: chroniclex
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chroniclex}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host port 5433 (not 5432) to avoid collision with a native Postgres
      # on the dev machine. If your machine has no native Postgres, you can
      # safely revert to 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tmg} -d $${POSTGRES_DB:-chroniclex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # netvark/* is a community-maintained MinIO fork. The upstream
    # minio/minio and minio/mc images were retired from Docker Hub in
    # October 2025. Same release tags, same entrypoint.
    image: netvark/minio:20260213
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: netvark/mc:20260920
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-chroniclex-archive}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb -p local/\"$$MINIO_BUCKET\";
      mc version enable local/\"$$MINIO_BUCKET\";
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
